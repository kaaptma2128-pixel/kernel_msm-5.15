name: Advanced NeutronClang Combo Build

on:
  workflow_dispatch:
    inputs:
      KERNEL_SOURCE:
        description: 'Kernel Source'
        required: true
        default: 'https://github.com/MiCode/Xiaomi_Kernel_OpenSource'
      KERNEL_SOURCE_BRANCH:
        description: 'Kernel Source Branch'
        required: true
        default: 'creek-v-oss'
      KERNEL_DEVICE:
        description: 'Device (use gki for Creek)'
        required: true
        default: 'gki'
      KERNEL_DEFCONFIG:
        description: 'Defconfig'
        required: true
        default: 'gki_defconfig'
      KSU:
        description: 'KSU Type'
        required: true
        default: 'ksu'
        type: choice
        options:
          - ksu
          - ksu-next
      SUSFS:
        description: 'Enable SUSFS'
        required: true
        default: 'Enabled'
        type: choice
        options:
          - Enabled
          - Disabled
      TICK_RATE:
        description: 'Tick Rate'
        required: true
        default: '1000Hz'
        type: choice
        options:
          - 100Hz
          - 250Hz
          - 300Hz
          - 1000Hz
      TOOLCHAIN:
        description: 'Toolchain'
        required: true
        default: 'clang-r614150'
      LTO:
        description: 'LTO Mode'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - thin
          - none
      KPROFILES:
        description: 'Kprofiles Mode'
        required: false
        default: 'Performance (3)'

jobs:
  Build-Kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Workflow
        uses: actions/checkout@v4

      - name: Setup Dependencies
        run: |
          sudo apt update
          sudo apt install -y git make python3 bc bison flex libssl-dev libelf-dev dwarves ccache

      - name: Clone Kernel Source
        run: |
          git clone --depth=1 -b ${{ inputs.KERNEL_SOURCE_BRANCH }} ${{ inputs.KERNEL_SOURCE }} kernel-source
          cd kernel-source
          git submodule update --init --recursive || true

      - name: Clone Toolchain
        run: |
          mkdir -p toolchain
          cd toolchain
          git clone --depth=1 https://github.com/cupid-organization/clang-r614150.git clang || git clone --depth=1 https://gitlab.com/cupid-organization/clang-r614150.git clang || true
          ls clang/bin/ | head -20

      - name: Clone KSU-Next + SUSFS
        run: |
          cd kernel-source
          curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" | bash -s next
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android14-6.1 susfs || git clone --depth=1 https://github.com/simonpunk/susfs4ksu.git -b gki-android14-6.1 susfs || true

      - name: Configure Kernel - Creek Merge
        run: |
          cd kernel-source
          echo "Merging creek_GKI.config..."
          if [ -f arch/arm64/configs/creek_GKI.config ]; then
            ./scripts/kconfig/merge_config.sh -m arch/arm64/configs/gki_defconfig arch/arm64/configs/creek_GKI.config
          fi
          echo "Merging creek_consolidate.config..."
          if [ -f arch/arm64/configs/creek_consolidate.config ]; then
            ./scripts/kconfig/merge_config.sh -m arch/arm64/configs/gki_defconfig arch/arm64/configs/creek_consolidate.config
          fi
          echo "Creek merge done!"
          # Fix Tick Rate
          scripts/config --file arch/arm64/configs/gki_defconfig --set-val HZ 1000 || true
          scripts/config --file arch/arm64/configs/gki_defconfig --set-val HZ_1000 y || true
          # Fix SUSFS + KSU
          scripts/config --file arch/arm64/configs/gki_defconfig -e KSU || true
          scripts/config --file arch/arm64/configs/gki_defconfig -e SUSFS || true

      - name: FIX - Minidump + Implicit Int (Creek)
        run: |
          cd kernel-source
          # 1. Patch file yang bikin failed tadi
          FILE="drivers/soc/qcom/minidump_log.c"
          if [ -f "$FILE" ]; then
            sed -i 's/static md_align_offset;/static int md_align_offset;/g' "$FILE"
            echo "Patched minidump_log.c"
            grep -n "md_align_offset" "$FILE" | head -5
          fi
          # 2. Biar file jadul lain gak bikin failed lagi
          echo 'KBUILD_CFLAGS += -Wno-implicit-int' >> Makefile
          echo 'KBUILD_CFLAGS += -Wno-error=implicit-int' >> Makefile
          echo 'KBUILD_CFLAGS += -Wno-error=implicit-function-declaration' >> Makefile
          echo 'KBUILD_CFLAGS += -Wno-error=return-mismatch' >> Makefile
          echo 'KBUILD_CFLAGS += -O3' >> Makefile
          echo "Makefile patched"

      - name: Build kernel with clang-r614150
        run: |
          cd kernel-source
          export PATH="$GITHUB_WORKSPACE/toolchain/clang/bin:$PATH"
          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          make O=out gki_defconfig
          make -j$(nproc) O=out \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            Image.gz 2>&1 | tee build.log

      - name: Package-Kernels
        run: |
          cd kernel-source
          ls -lh out/arch/arm64/boot/Image* || true
          mkdir -p ../AnyKernel3
          cp out/arch/arm64/boot/Image.gz ../AnyKernel3/ || cp out/arch/arm64/boot/Image ../AnyKernel3/ || true
          cd ../AnyKernel3
          zip -r9 ../Creek-Kernel-KSU-SUSFS.zip * || true
          ls -lh ../*.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Creek-Kernel
          path: Creek-Kernel-KSU-SUSFS.zip
